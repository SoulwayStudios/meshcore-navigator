[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-navigator"
version = "0.0.3"
description = "MESHCORE NAVIGATOR - MeshCore Desktop Station, Live Map & Matrix Integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicky Proniewicz - M7NCY" }
]
dependencies = [
    "PyQt6>=6.5.0",
    "qasync>=0.27.0",
    "pyserial>=3.5",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "meshcore>=2.3.0",
    "pixoo>=0.9.0",
]

[project.scripts]
meshcore-tray = "meshcore_tray.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshcore_tray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

